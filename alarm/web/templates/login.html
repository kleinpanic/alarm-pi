<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unlock · AlarmPi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-[#0b0e14] text-slate-200">
  <div class="flex min-h-full items-center justify-center px-4">
    <form method="post" class="w-full max-w-xs space-y-4 rounded-2xl border border-[#222b3d] bg-[#141925] p-6 text-center">
      <div class="text-4xl">⏰</div>
      <h1 class="text-lg font-semibold">AlarmPi locked</h1>
      {% if error %}<div class="rounded-lg bg-rose-500/10 px-3 py-2 text-sm text-rose-300">{{ error }}</div>{% endif %}
      <input name="pin" type="password" inputmode="numeric" autofocus placeholder="PIN"
        class="w-full rounded-xl border border-[#222b3d] bg-[#0b0e14] px-4 py-2.5 text-center font-mono outline-none focus:border-indigo-500">
      <button class="w-full rounded-xl bg-indigo-500 px-4 py-2.5 font-semibold text-white hover:bg-indigo-400">Unlock</button>
    </form>
  </div>
</body>
</html>
