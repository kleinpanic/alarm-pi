<!doctype html>
<html lang="en" class="h-full bg-obsidian">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1017">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <title>Unlock · AlarmPi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="min-h-full bg-obsidian text-slate-100 antialiased">
  <main class="grid min-h-screen place-items-center px-4 py-10">
    <form method="post" class="w-full max-w-sm rounded-[2rem] border border-white/10 bg-slate-900/85 p-7 shadow-2xl shadow-black/40">
      <div class="mb-8 text-center"><span class="mx-auto grid h-14 w-14 place-items-center rounded-2xl border border-amber-300/30 bg-amber-300/10 font-mono font-bold text-amber-200">AP</span><h1 class="mt-5 text-2xl font-semibold text-white">Unlock AlarmPi</h1><p class="mt-2 text-sm text-slate-400">Enter the appliance PIN to open alarm controls.</p></div>
      {% if error %}<div role="alert" class="mb-4 rounded-xl border border-rose-400/30 bg-rose-400/10 px-4 py-3 text-sm text-rose-200">{{ error }}. Check the PIN and try again.</div>{% endif %}
      <label for="login-pin" class="mb-2 block text-sm font-medium text-slate-300">Appliance PIN</label>
      <input id="login-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus required class="field w-full text-center font-mono text-lg tracking-[.3em]" aria-describedby="pin-help">
      <p id="pin-help" class="mt-2 text-xs text-slate-500">Localhost access does not require a PIN.</p>
      <button class="button button-primary mt-6 w-full">Unlock control center</button>
    </form>
  </main>
</body>
</html>
