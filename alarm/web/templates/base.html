<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Alarm{% endblock %} · eulerpi4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { mono: ['ui-monospace','SFMono-Regular','Menlo','monospace'] },
        colors: { ink: '#0b0e14', panel: '#141925', edge: '#222b3d' }
      } }
    }
  </script>
</head>
<body class="h-full bg-ink text-slate-200 antialiased">
  <div class="mx-auto max-w-3xl px-4 pb-24">
    <header class="flex items-center justify-between py-5">
      <a href="{{ url_for('dashboard') }}" class="flex items-center gap-2 text-lg font-semibold tracking-tight">
        <span class="text-2xl">⏰</span>
        <span>Alarm<span class="text-indigo-400">Pi</span></span>
      </a>
      <nav class="flex items-center gap-1 text-sm">
        {% set tab = active_tab|default('') %}
        <a href="{{ url_for('dashboard') }}" class="rounded-lg px-3 py-1.5 {{ 'bg-indigo-500/15 text-indigo-300' if tab=='home' else 'text-slate-400 hover:text-slate-200' }}">Home</a>
        <a href="{{ url_for('alarms_page') }}" class="rounded-lg px-3 py-1.5 {{ 'bg-indigo-500/15 text-indigo-300' if tab=='alarms' else 'text-slate-400 hover:text-slate-200' }}">Alarms</a>
        <a href="{{ url_for('settings_page') }}" class="rounded-lg px-3 py-1.5 {{ 'bg-indigo-500/15 text-indigo-300' if tab=='settings' else 'text-slate-400 hover:text-slate-200' }}">Settings</a>
      </nav>
    </header>
    {% block body %}{% endblock %}
  </div>
</body>
</html>
